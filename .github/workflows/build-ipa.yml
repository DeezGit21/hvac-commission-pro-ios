name: Build iOS IPA

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  SCHEME: HVACCommissionPro
  PROJECT: HVACCommissionPro.xcodeproj
  CONFIGURATION: Release

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: List schemes
        run: xcodebuild -list -project $PROJECT

      - name: Build .app (unsigned, no signing)
        run: |
          set -ex
          xcodebuild build \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration "$CONFIGURATION" \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM=""

      - name: Locate built .app
        id: locate
        run: |
          set -ex
          APP_PATH=$(find build/DerivedData -name "HVACCommissionPro.app" -type d | head -1)
          echo "app_path=$APP_PATH" >> "$GITHUB_OUTPUT"
          echo "Found .app at: $APP_PATH"
          ls -la "$APP_PATH"

      - name: Create unsigned IPA
        run: |
          set -ex
          mkdir -p build/Payload
          cp -R "${{ steps.locate.outputs.app_path }}" build/Payload/
          cd build
          zip -r HVACCommissionPro-unsigned.ipa Payload
          ls -lh HVACCommissionPro-unsigned.ipa

      - name: Upload IPA artifact
        id: artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: HVACCommissionPro-IPA
          path: build/HVACCommissionPro-unsigned.ipa
          retention-days: 30

      - name: Upload IPA to GitHub Release (fallback if artifact quota full)
        if: steps.artifact.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: IPA-${{ github.run_number }}
          name: HVAC Commission Pro IPA (Build ${{ github.run_number }})
          files: build/HVACCommissionPro-unsigned.ipa
          prerelease: true

      - name: Print download URL
        run: |
          echo "IPA built successfully!"
          echo "Download from: https://github.com/DeezGit21/hvac-commission-pro-ios/releases"
